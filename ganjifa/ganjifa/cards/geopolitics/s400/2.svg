<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <clipPath id="circle"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#1A2A00"/>
