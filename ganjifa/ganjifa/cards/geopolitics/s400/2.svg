  <!-- Inner ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#8B8B00" stroke-width="1" opacity="0.4"/>
  <!-- Corner rank labels -->
  <text x="12" y="14" text-anchor="middle" font-size="8" fill="#8B8B00" opacity="0.7" font-weight="bold">2</text>
  <text x="88" y="90" text-anchor="middle" font-size="8" fill="#8B8B00" opacity="0.7" font-weight="bold" transform="rotate(180,88,90)">2</text>
  <!-- Decorative dots -->
  <circle cx="94.0" cy="50.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="88.1" cy="72.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="72.0" cy="88.1" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="50.0" cy="94.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="28.0" cy="88.1" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="11.9" cy="72.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="6.0" cy="50.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="11.9" cy="28.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="28.0" cy="11.9" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="50.0" cy="6.0" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="72.0" cy="11.9" r="1.2" fill="#8B8B00" opacity="0.3"/><circle cx="88.1" cy="28.0" r="1.2" fill="#8B8B00" opacity="0.3"/>
  <!-- Card body clipped to circle -->
  <g clip-path="url(#circle)">
      <g opacity="0.85"><text x="50" y="28" text-anchor="middle" dominant-baseline="middle" font-size="12">🎯</text>
<text x="50" y="72" text-anchor="middle" dominant-baseline="middle" font-size="12">🎯</text></g>
      <text x="50" y="84" text-anchor="middle" dominant-baseline="middle"
            font-size="7" fill="#8B8B00" opacity="0.6">S-400</text></g>
