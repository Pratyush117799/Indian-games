<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <clipPath id="circle"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#8B5E1A"/>
  <!-- Outer border ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#DAA520" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#DAA520" stroke-width="1" opacity="0.4"/>
  <!-- Corner rank labels -->
  <text x="12" y="14" text-anchor="middle" font-size="8" fill="#DAA520" opacity="0.7" font-weight="bold">Mantri</text>
  <text x="88" y="90" text-anchor="middle" font-size="8" fill="#DAA520" opacity="0.7" font-weight="bold" transform="rotate(180,88,90)">Mantri</text>
  <!-- Decorative dots -->
  <circle cx="94.0" cy="50.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="88.1" cy="72.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="72.0" cy="88.1" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="50.0" cy="94.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="28.0" cy="88.1" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="11.9" cy="72.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="6.0" cy="50.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="11.9" cy="28.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="28.0" cy="11.9" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="50.0" cy="6.0" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="72.0" cy="11.9" r="1.2" fill="#DAA520" opacity="0.3"/><circle cx="88.1" cy="28.0" r="1.2" fill="#DAA520" opacity="0.3"/>
  <!-- Card body clipped to circle -->
  <g clip-path="url(#circle)">
      <!-- Crown / court indicator -->
      <circle cx="50" cy="42" r="18" fill="#DAA520" opacity="0.25"/>
      <text x="50" y="38" text-anchor="middle" dominant-baseline="middle" font-size="20">🐢</text>
      <text x="50" y="57" text-anchor="middle" dominant-baseline="middle"
            font-size="9" fill="#DAA520" font-weight="bold" font-family="serif">
        MANTRI
      </text>
      <text x="50" y="70" text-anchor="middle" dominant-baseline="middle"
            font-size="7" fill="#DAA520" opacity="0.7">Kurma</text>
      <text x="50" y="80" text-anchor="middle" dominant-baseline="middle"
            font-size="6" fill="#DAA520" opacity="0.5">Kambar</text></g>
</svg>